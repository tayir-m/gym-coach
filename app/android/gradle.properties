org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# aarch64 host workaround: use the SDK's bundled aapt2 (shell-script wrapper).
android.aapt2FromMavenOverride=/opt/android-sdk/build-tools/34.0.0/aapt2

kotlin.code.style=official
ksp.useKSP2=false
